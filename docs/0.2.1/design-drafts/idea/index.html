<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nodu 设计稿</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#e7eaef;font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}nav{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;border-bottom:1px solid #343a45;background:#181b21}nav>div{display:flex;gap:5px;align-items:center}strong{margin-right:16px;font-weight:600}button{font:inherit;color:#b9c0cb;background:transparent;border:1px solid transparent;border-radius:5px;padding:8px 11px;cursor:pointer}button:hover{background:#23272f}button[aria-pressed=true]{color:#e7eaef;background:#23272f;border-color:#646d7c}button:focus-visible{outline:2px solid #8fa8ff;outline-offset:2px}.mode{border-left:1px solid #343a45;padding-left:12px;margin-left:10px}.draft{display:block;width:min(1120px,100%);height:auto;margin:0 auto}footer{display:flex;justify-content:space-between;gap:24px;max-width:1040px;margin:0 auto;padding:0 0 20px;color:#949caa;font-size:12px}#compare{display:none;grid-template-columns:1fr 1fr 1fr;padding:24px;gap:16px}#compare img{width:100%;border:1px solid #343a45;border-radius:6px}#compare p{line-height:1.7;color:#949caa}#compare h2{font-size:16px;font-weight:600}.light{background:#e9ecf0}.light footer{color:#596475}.light #compare{color:#20252e}.light #compare p{color:#596475}@media(max-width:900px){nav{flex-wrap:wrap}footer{padding:12px 24px}#compare{grid-template-columns:1fr}}
</style><nav aria-label="IDEA 布局设计对比"><div><strong>Nodu</strong><button data-view="01" aria-pressed="false">01 目录式</button><button data-view="02" aria-pressed="true">02 紧凑式</button><button data-view="03" aria-pressed="false">03 型号直选</button><button data-view="compare" aria-pressed="false">对比</button></div><div><button data-page="start" aria-pressed="false">开始页</button><button data-page="project" aria-pressed="true">新建项目</button><button id="theme" class="mode" aria-pressed="false">浅色</button></div></nav>
<img id="draft" class="draft" src="02-project-dark.svg" alt="02 紧凑式新建项目设计稿">
<section id="compare" aria-label="三套设计对比"><article><h2>01 目录式</h2><img data-layout="01" src="01-project-dark.svg" alt="目录式设计"></article><article><h2>02 紧凑式</h2><img data-layout="02" src="02-project-dark.svg" alt="紧凑式设计"></article><article><h2>03 型号直选</h2><img data-layout="03" src="03-project-dark.svg" alt="型号直选设计"></article></section>

<script>
let view='02',theme='dark',page='project';function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));document.querySelector('#draft').style.display=view==='compare'?'none':'block';document.querySelector('#compare').style.display=view==='compare'?'grid':'none';if(view!=='compare'){document.querySelector('#draft').src=`${view}-${page}-${theme}.svg`;document.querySelector('#draft').alt=`${view} ${page==='project'?'新建项目':'开始页'}设计稿`;}document.querySelectorAll('[data-layout]').forEach(i=>i.src=`${i.dataset.layout}-${page}-${theme}.svg`);document.body.classList.toggle('light',theme==='light');document.querySelector('#theme').textContent=theme==='dark'?'浅色':'深色';document.querySelector('#theme').setAttribute('aria-pressed',String(theme==='light'));}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));document.querySelector('#theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';render()});
</script></html>
