<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nodu · 双栏紧凑设计</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#e7eaef;font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}nav{height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;border-bottom:1px solid #343a45;background:#181b21}nav>div{display:flex;gap:6px;align-items:center}strong{margin-right:18px;font-weight:600}button{font:inherit;color:#b9c0cb;background:transparent;border:1px solid transparent;border-radius:5px;padding:8px 12px;cursor:pointer}button:hover{background:#23272f}button[aria-pressed=true]{color:#e7eaef;background:#23272f;border-color:#646d7c}button:focus-visible{outline:2px solid #8fa8ff;outline-offset:2px}.draft{display:block;width:min(1120px,100%);height:auto;margin:0 auto}footer{display:flex;justify-content:space-between;gap:24px;max-width:1040px;margin:0 auto;padding:0 0 20px;color:#949caa;font-size:12px}#compare{display:none;grid-template-columns:1fr 1fr 1fr;padding:30px 24px;gap:16px}#compare img{width:100%;border:1px solid #343a45;border-radius:6px}#compare p{line-height:1.7;color:#949caa}#compare h2{font-size:16px;font-weight:600}.light{background:#e9ecf0}.light footer{color:#596475}.light #compare{color:#20252e}.light #compare p{color:#596475}@media(max-width:760px){nav{height:auto;flex-wrap:wrap;padding:12px}nav strong{margin:0}footer{padding:12px 24px}#compare{grid-template-columns:1fr}}
</style><nav aria-label="双栏设计对比"><div><strong>双栏 · 第二轮</strong><button data-view="01" aria-pressed="true">01 均衡紧凑</button><button data-view="02" aria-pressed="false">02 高密度</button><button data-view="03" aria-pressed="false">03 合并布局</button><button data-view="compare" aria-pressed="false">并排对比</button></div><div><button id="theme" aria-pressed="false">浅色</button></div></nav>
<img id="draft" class="draft" src="01-dark.svg" alt="版本 01 均衡紧凑双栏设计">
<section id="compare" aria-label="三个紧凑双栏版本"><article><h2>01 均衡紧凑</h2><img data-layout="01" src="01-dark.svg" alt="版本 01"><p>680 × 340 · 面积减少 35%<br>34 px 控件，侧栏与表单逐行对齐。</p></article><article><h2>02 高密度</h2><img data-layout="02" src="02-dark.svg" alt="版本 02"><p>624 × 300 · 面积减少 47%<br>32 px 控件，弱化分区与按钮栏。</p></article><article><h2>03 合并布局</h2><img data-layout="03" src="03-dark.svg" alt="版本 03"><p>700 × 312 · 面积减少 38%<br>标题并入侧栏，型号与模板并列。</p></article></section>
<footer><span id="caption">01 · 680 × 340 px · 侧栏 144 px · 控件 34 px</span><span>静态设计稿 · 相同内容、字号与比例</span></footer>
<script>
let view='01',theme='dark';const captions={'01':'01 · 680 × 340 px · 侧栏 144 px · 控件 34 px','02':'02 · 624 × 300 px · 侧栏 136 px · 控件 32 px','03':'03 · 700 × 312 px · 侧栏 152 px · 控件 34 px',compare:'相对上一版 788 × 450 px，三版均缩减空白，不缩小正文字号。'};function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelector('#draft').style.display=view==='compare'?'none':'block';document.querySelector('#compare').style.display=view==='compare'?'grid':'none';if(view!=='compare'){document.querySelector('#draft').src=`${view}-${theme}.svg`;document.querySelector('#draft').alt=captions[view];}document.querySelectorAll('[data-layout]').forEach(i=>i.src=`${i.dataset.layout}-${theme}.svg`);document.querySelector('#caption').textContent=captions[view];document.body.classList.toggle('light',theme==='light');document.querySelector('#theme').textContent=theme==='dark'?'浅色':'深色';document.querySelector('#theme').setAttribute('aria-pressed',String(theme==='light'));}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));document.querySelector('#theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';render()});
</script></html>
