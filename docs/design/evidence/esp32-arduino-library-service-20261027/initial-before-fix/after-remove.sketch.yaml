# Preserve the project note.
default_profile: nodu
profiles:
  nodu:
    fqbn: esp32:esp32:esp32c3 # Preserve the board note.
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - Adafruit GFX Library (1.13.0)
      - Adafruit NeoPixel (1.15.5)
      - Adafruit SSD1306 (2.5.17)
      - ArduinoMqttClient (0.1.8)
      - DallasTemperature (4.0.6)
      - DHT sensor library (1.4.7)
      - ESP32Servo (3.2.1)
      - dependency: Adafruit BusIO (1.17.4)
      - dependency: Adafruit Unified Sensor (1.1.15)
      - dependency: OneWire (2.3.8)
  # Preserve the other profile note.
  backup:
    fqbn: esp32:esp32:esp32c3
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
