name: Brand guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Generated brand files in sync, contrast targets, current rasters, no v1 or hardcoded brand colours in the UI.
      - run: node desktop/scripts/check-brand.cjs
