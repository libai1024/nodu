[workspace]
members = ["crates/*"]
# Tool-created dot directories (for example `.claude`) are not crates.
exclude = ["crates/.claude"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
struct_excessive_bools = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
wildcard_imports = "allow"
enum_glob_use = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
redundant_else = "allow"
unused_self = "allow"
unnecessary_wraps = "allow"
single_match_else = "allow"
redundant_closure_for_method_calls = "allow"
map_unwrap_or = "allow"
manual_let_else = "allow"
manual_div_ceil = "allow"
format_push_string = "allow"
format_collect = "allow"
collapsible_if = "allow"
cast_possible_wrap = "allow"
bool_comparison = "allow"
match_same_arms = "allow"
if_not_else = "allow"
unreadable_literal = "allow"

[workspace.dependencies]
nodu-protocol = { path = "crates/nodu-protocol" }
nodu-serial = { path = "crates/nodu-serial" }
nodu-repl = { path = "crates/nodu-repl" }
nodu-mockboard = { path = "crates/nodu-mockboard" }
nodu-maix-ide = { path = "crates/nodu-maix-ide" }
nodu-maix-connect = { path = "crates/nodu-maix-connect" }
nodu-media = { path = "crates/nodu-media" }
nodu-kflash = { path = "crates/nodu-kflash" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serialport = "4.10.1"
base64 = "0.22"
sha2 = "0.10"
# Raw DEFLATE through the system zlib so archives are byte-identical to the
# ones Python's zipfile (also system zlib 1.2.12) produces.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
# Local-time conversion for ZIP member DOS timestamps (Python
# `time.localtime` parity); `local-offset` keeps unsafe inside the dep.
time = { version = "0.3", features = ["local-offset"] }
jpeg-decoder = "0.3"
tempfile = "3"
ts-rs = "11"
proptest = "1"
crossterm = "0.29"
