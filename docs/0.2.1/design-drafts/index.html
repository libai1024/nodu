<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nodu · 新建项目设计对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#e7eaef;font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}nav{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid #343a45;background:#181b21}nav>div{display:flex;gap:6px;align-items:center}strong{margin-right:22px;font-weight:600}button{font:inherit;color:#b9c0cb;background:transparent;border:1px solid transparent;border-radius:6px;padding:9px 14px;cursor:pointer}button:hover{background:#23272f}button[aria-pressed=true]{color:#e7eaef;background:#23272f;border-color:#646d7c}button:focus-visible{outline:2px solid #8fa8ff;outline-offset:2px}.draft{display:block;width:min(1120px,100%);height:auto;margin:0 auto}footer{display:flex;justify-content:space-between;gap:24px;max-width:1040px;margin:0 auto;padding:12px 0 24px;color:#949caa;font-size:12px}a{color:#8fa8ff;text-decoration:none}#compare{display:none;grid-template-columns:1fr 1fr 1fr;padding:32px 24px;gap:16px}#compare img{width:100%;border:1px solid #343a45;border-radius:8px}#compare p{line-height:1.6;color:#949caa}#compare h2{font-size:16px;font-weight:600}body.light{background:#e9ecf0}body.light footer{color:#596475}@media(max-width:760px){nav{flex-wrap:wrap}nav strong{margin:0}footer{padding:16px 24px}#compare{grid-template-columns:1fr}}
</style>
<nav aria-label="设计稿对比"><div><strong>设计草稿</strong><button data-view="A" aria-pressed="false">A · 双栏</button><button data-view="B" aria-pressed="true">B · 紧凑</button><button data-view="C" aria-pressed="false">C · 页面</button><button data-view="compare" aria-pressed="false">并排对比</button><button data-view="controls" aria-pressed="false">控件状态</button></div><div><button id="theme" aria-pressed="false">浅色</button></div></nav>
<img id="draft" class="draft" src="B-dark.svg" alt="B：顶部系列切换与紧凑表单设计草稿">
<section id="compare" aria-label="三套设计草稿并排对比"><article><h2>A · 双栏</h2><img data-layout="A" src="A-dark.svg" alt="A 双栏设计"><p>系列常驻左侧，适合型号目录继续增长。</p></article><article><h2>B · 紧凑</h2><img data-layout="B" src="B-dark.svg" alt="B 紧凑设计"><p>四类芯片直接切换，占用空间更少。</p></article><article><h2>C · 页面</h2><img data-layout="C" src="C-dark.svg" alt="C 页面设计"><p>在编辑区内创建，适合较长配置流程。</p></article></section>
<footer><span id="caption">B · 顶部系列切换，型号与模板并列。</span><span>静态设计稿 · 不创建工程、不修改应用</span></footer>
<script>
let view='B',theme='dark';const captions={A:'A · 左侧系列导航，右侧字段纵向对齐。',B:'B · 顶部系列切换，型号与模板并列。',C:'C · 在编辑区内创建，模板直接展开。',compare:'同一内容、同一品牌色，只比较布局与操作。',controls:'按钮与输入框的视觉状态规范。'};function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelector('#draft').style.display=view==='compare'?'none':'block';document.querySelector('#compare').style.display=view==='compare'?'grid':'none';document.querySelector('#draft').src=view==='controls'?'controls.svg':`${view}-${theme}.svg`;document.querySelector('#draft').alt=captions[view];document.querySelectorAll('[data-layout]').forEach(i=>i.src=`${i.dataset.layout}-${theme}.svg`);document.querySelector('#caption').textContent=captions[view];document.body.classList.toggle('light',theme==='light'&&view!=='controls');document.querySelector('#theme').textContent=theme==='dark'?'浅色':'深色';document.querySelector('#theme').setAttribute('aria-pressed',String(theme==='light'));}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));document.querySelector('#theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';render()});
</script></html>
